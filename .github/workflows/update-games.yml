name: Päivitä Sisu Hockeyn ottelut

on:
  schedule:
    - cron: '15 7,16,20 * * 1-5'
    - cron: '0 8 * * 6,7'
    - cron: '0 9 * * 6,7'
    - cron: '0 10 * * 6,7'
    - cron: '0 11 * * 6,7'
    - cron: '0 12 * * 6,7'
    - cron: '0 13 * * 6,7'
    - cron: '0 14 * * 6,7'
    - cron: '0 15 * * 6,7'
    - cron: '0 16 * * 6,7'
    - cron: '0 17 * * 6,7'
    - cron: '0 18 * * 6,7'
    - cron: '0 19 * * 6,7'
    - cron: '0 20 * * 6,7'
    - cron: '0 21 * * 6,7'
    - cron: '0 22 * * 6,7'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sisu_ottelut.py"
      - "render_html.py"
      - "publish.py"
      - "assets/**"
      - ".github/workflows/update-games.yml"

permissions:
  contents: write

concurrency:
  group: sisu-ottelut
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae ottelut ja rakenna sivu
        run: python3 publish.py --out docs

      - name: Tallenna Pages-tiedostot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Päivitä ottelut $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

name: Päivitä Sisu Hockeyn ottelut

on:
  schedule:
    # Aamu (Helsinki ~7:15, kattaa kesä- ja talviajan)
    - cron: "15 4 * * *"
    - cron: "15 6 * * *"
    # Iltapäivä ja ilta: valmistuneet tulokset
    - cron: "15 12 * * *"
    - cron: "15 14 * * *"
    - cron: "15 17 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sisu_ottelut.py"
      - "render_html.py"
      - "publish.py"
      - "assets/**"
      - "docs/**"
      - ".github/workflows/update-games.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sisu-ottelut
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae ottelut ja rakenna sivu
        id: publish
        continue-on-error: true
        run: python3 publish.py --out docs

      - name: Tallenna Pages-tiedostot
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Ei muutoksia repossa."
          else
            git commit -m "Päivitä ottelut $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
